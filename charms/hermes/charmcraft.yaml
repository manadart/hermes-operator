type: charm
name: hermes-operator
title: Hermes Agent
summary: A persistent Hermes agent on a Juju-managed machine.
description: |
  Installs a pinned Hermes Agent release and runs its authenticated HTTP gateway
  under systemd. Uses OpenRouter with credentials supplied through a Juju secret.
  The initial charm supports one unit, with local persistent state and workspace.
base: ubuntu@24.04
platforms:
  amd64:
parts:
  charm:
    plugin: uv
    source: .
    build-snaps: [astral-uv]
    build-packages: [python3-dev]
peers:
  peers:
    interface: hermes_peer
requires:
  context-store:
    interface: openviking
    limit: 1
config:
  options:
    model:
      type: string
      default: z-ai/glm-5.3
      description: OpenRouter model ID used for new agent sessions.
    openrouter-secret:
      type: secret
      description: Juju secret URI containing the api-key field for OpenRouter.
    context-id:
      type: string
      default: ""
      description: |
        Stable OpenViking context identity (lowercase letters, digits and hyphens,
        up to 63 characters). Empty derives an ID from this model and application.
        Set an existing identity before relating a replacement application to
        reconnect to its knowledge. Remove the relation before changing this ID.
    github-app-id:
      type: string
      default: ""
      description: Numeric GitHub App ID, exposed as GH_APP_ID when github-app-secret is set.
    github-installation-id:
      type: string
      default: ""
      description: Numeric GitHub App installation ID, exposed as GH_INSTALL_ID.
    github-app-secret:
      type: secret
      description: |
        Optional Juju secret containing private-key, an unencrypted RSA private key
        in PEM format. Setting this enables GitHub App configuration and requires
        github-app-id and github-installation-id. Unset it to remove the local key.
        Also authenticates gh CLI commands as this installation on github.com.
    max-turns:
      type: int
      default: 20
      description: Maximum model/tool iterations per conversation turn (1-1000).
actions:
  get-api-access:
    description: Return the loopback API URL and the Juju secret ID for its bearer token.
  restart:
    description: Reconcile configuration and restart Hermes. In-flight work may be interrupted.
  check-github-app:
    description: |
      Reconcile configuration, then check gh authentication by listing installation
      repositories. Returns only the repository count and public App/installation
      IDs. Does not post to GitHub or make model requests.
  check-context:
    description: Check related OpenViking access and return the public context identity without model requests.
