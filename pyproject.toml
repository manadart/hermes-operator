[project]
name = "hermes-operator"
version = "0.1.0"
requires-python = ">=3.12"
description = "Juju machine charm for Hermes Agent"
dependencies = [
    "ops==3.8.2",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
    "ops[testing]==3.8.2",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
